name: Review TV awards pilot in Chromium
on:
  push:
    branches: [feat/tv-awards-2025]
    paths: ['tv.js', 'tv.css', 'tv-awards*.js', 'routes.js', 'awards.js', 'scripts/preview-tv-awards.mjs', '.github/workflows/tv-awards-preview.yml']
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: node scripts/preview-tv-awards.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-awards-2025-previews
          path: docs/previews/tv-awards-2025-*
