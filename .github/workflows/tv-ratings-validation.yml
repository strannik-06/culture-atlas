name: TV ratings validation
on:
  pull_request:
    paths: ['tv*', 'work-identities.js', 'index.html', 'supabase/migrations/20261019_tv*.sql', 'tests/tv-ratings.test.mjs', 'tests/test_final_tv_import.py', 'scripts/prepare-final-tv-import.py', 'scripts/audit-final-source-coverage.py', 'imports/remaining-version-decisions.json', 'import-previews/final-source-coverage-summary.json', 'scripts/validate-work-catalog.mjs', 'package*.json', '.github/workflows/tv-ratings-validation.yml']
  push:
    branches: [main]
    paths: ['tv*', 'work-identities.js', 'index.html', 'supabase/migrations/20261019_tv*.sql', 'tests/tv-ratings.test.mjs', 'tests/test_final_tv_import.py', 'scripts/prepare-final-tv-import.py', 'scripts/audit-final-source-coverage.py', 'imports/remaining-version-decisions.json', 'import-previews/final-source-coverage-summary.json', 'scripts/validate-work-catalog.mjs', 'package*.json', '.github/workflows/tv-ratings-validation.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check tv.js
      - run: node scripts/validate-work-catalog.mjs
      - run: node --test tests/tv-ratings.test.mjs
      - run: python3 -m unittest discover -s tests -p 'test_final_tv_import.py'
      - run: python3 scripts/audit-final-source-coverage.py --check
