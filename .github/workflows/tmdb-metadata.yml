name: TMDB metadata validation
on:
  workflow_dispatch:
jobs:
  validate:
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate script syntax
        run: node --check scripts/refresh-tmdb.mjs
      - name: Audit metadata and TMDB identities (read-only)
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/refresh-tmdb.mjs
      - name: Upload metadata validation report
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: tmdb-metadata-validation
          path: tmdb-metadata-report.json
          if-no-files-found: warn
