name: Books validation
on:
  pull_request:
    paths: ['books.js', 'assets/book-covers/**', 'assets/awards/*.svg', 'book-awards*.js', 'awards.js', 'awards.css', 'imports/book-awards-2026-*.json', 'imports/book-awards-2026-catalogue-sync.sql', 'scripts/prepare-book-awards.mjs', 'tests/book-awards.test.mjs', 'books.css', 'details.css', 'index.html', 'supabase/migrations/20261019_books_search_ratings.sql', 'scripts/test-books.mjs', 'package*.json', '.github/workflows/books-validation.yml']
  push:
    branches: [main]
    paths: ['books.js', 'assets/book-covers/**', 'assets/awards/*.svg', 'book-awards*.js', 'awards.js', 'awards.css', 'imports/book-awards-2026-*.json', 'imports/book-awards-2026-catalogue-sync.sql', 'scripts/prepare-book-awards.mjs', 'tests/book-awards.test.mjs', 'books.css', 'details.css', 'index.html', 'supabase/migrations/20261019_books_search_ratings.sql', 'scripts/test-books.mjs', 'package*.json', '.github/workflows/books-validation.yml']
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - run: node --check books.js
      - run: npm test
      - run: node --test tests/book-awards.test.mjs tests/awards.test.mjs tests/routes.test.mjs
      - run: node scripts/prepare-book-awards.mjs
      - run: git diff --exit-code -- book-awards-2026.js imports/book-awards-2026-audit.json imports/book-awards-2026-catalogue-sync.sql
