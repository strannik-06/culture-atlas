name: Review remaining historical ratings
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  review:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download original TMDB matching results
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow personal-ratings-match.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          mkdir -p /tmp/matches
          gh run download "$run_id" --name personal-ratings-tmdb-candidates --dir /tmp/matches
          test -s /tmp/matches/ratings-import-review-v2.json
      - name: Build review queue against current catalogue
        run: |
          node scripts/prepare-remaining-ratings-review.mjs /tmp/matches/ratings-import-review-v2.json imports/personal-ratings-cleaned.csv
      - name: Upload private review artifact
        uses: actions/upload-artifact@v4
        with:
          name: remaining-historical-ratings-review
          path: |
            remaining-ratings-review.csv
            remaining-ratings-review-summary.json
          retention-days: 30
