name: Verify 55 historical film candidates
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Read-only TMDB batch lookup
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/verify-historical-55-movies.py historical-55-tmdb-candidates.csv
      - uses: actions/upload-artifact@v4
        with:
          name: historical-55-tmdb-candidates
          path: historical-55-tmdb-candidates.csv
