name: Media search and backup validation
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci --ignore-scripts
      - run: node --test tests/media.test.mjs tests/routes.test.mjs tests/details.test.mjs tests/awards.test.mjs
      - name: Ensure canonical identity seed is current
        run: |
          node scripts/seed-media-catalogue.mjs
          git diff --exit-code -- supabase/migrations/20261021_media_catalogue_seed.sql
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: pip install -r scripts/backup-requirements.txt
      - run: python -m unittest discover -s tests -p test_backup.py
