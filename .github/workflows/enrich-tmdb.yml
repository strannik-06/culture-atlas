name: Refresh TMDB film metadata
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  enrich:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Enrich verified film metadata
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python scripts/enrich_tmdb.py
      - name: Commit metadata to feature branch
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add film-details.js tmdb-unmatched.json tmdb-diagnostics.json
          git diff --cached --quiet || git commit -m "Refresh verified TMDB posters and cast"
          git push
