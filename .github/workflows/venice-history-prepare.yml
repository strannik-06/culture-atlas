name: Prepare verified 2021–2025 Venice catalogue
on:
  push:
    branches: [feat/venice-2021-2025]
    paths: [scripts/prepare-venice-history.mjs, imports/venice-2021-2025-source.json, imports/venice-2021-2025-overrides.json, imports/film-metadata-overrides.json, .github/workflows/venice-history-prepare.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-venice-history
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match new films by title and director and fetch metadata
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/prepare-venice-history.mjs
      - run: node scripts/seed-media-catalogue.mjs
      - run: node scripts/prepare-venice-catalogue-sync.mjs
      - name: Commit data to the review branch
        if: always() && github.ref_name == 'feat/venice-2021-2025'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add imports/film-metadata-completion.json film-catalog.js film-details.js awards-2025.js imports/venice-2021-2025-audit.json supabase/migrations/20261021_media_catalogue_seed.sql
          if test -f imports/venice-2021-2025-catalogue-sync.sql; then git add imports/venice-2021-2025-catalogue-sync.sql; fi
          if ! git diff --cached --quiet; then
            git commit -m "Verify historical Venice identities and prepare catalogue"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
