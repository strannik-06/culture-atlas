name: Verify remaining historical directors
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download latest historical ratings review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow remaining-ratings-review.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          mkdir -p /tmp/review
          gh run download "$run_id" --name remaining-historical-ratings-review --dir /tmp/review
      - name: Triage all years equally
        run: node scripts/triage-remaining-ratings.mjs /tmp/review/remaining-ratings-review.csv
      - name: Verify normalized director names
        run: node scripts/verify-remaining-directors.mjs remaining-director_verification_needed.csv
      - name: Verify owner-confirmed matches and queue integrity
        run: |
          node --input-type=module <<'NODE'
          import fs from 'node:fs';
          const supported=fs.readFileSync('remaining-directors-supported.csv','utf8');
          const pending=fs.readFileSync('remaining-directors-manual-review.csv','utf8');
          const summary=JSON.parse(fs.readFileSync('remaining-director-verification-summary.json','utf8'));
          if(summary.total!==summary.director_name_supported+summary.manual_review)throw Error('Queue count mismatch');
          for(const id of ['780609','661374','619730']) {
            if(!supported.includes(','+id+',') && !supported.includes(','+id+',movie,'))throw Error('Confirmed match not supported: '+id);
          }
          if(!pending.includes('manual_review') && summary.manual_review>0)throw Error('Manual review output missing');
          NODE
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-director-verification
          path: |
            remaining-directors-*.csv
            remaining-director-verification-summary.json
            remaining-current_year_review.csv
          retention-days: 30
