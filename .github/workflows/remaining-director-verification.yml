name: Verify remaining historical directors
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download latest historical ratings review
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow remaining-ratings-review.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          mkdir -p /tmp/review
          gh run download "$run_id" --name remaining-historical-ratings-review --dir /tmp/review
      - name: Triage all years equally
        run: node scripts/triage-remaining-ratings.mjs /tmp/review/remaining-ratings-review.csv
      - name: Verify normalized director names
        run: node scripts/verify-remaining-directors.mjs remaining-director_verification_needed.csv
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-director-verification
          path: |
            remaining-directors-*.csv
            remaining-director-verification-summary.json
            remaining-current_year_review.csv
          retention-days: 30
