name: Canonical catalogue validation
on:
  pull_request:
  push:
    branches: [main]
jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: |
          node --check scripts/validate-catalog.mjs
          node scripts/validate-catalog.mjs
          node --check tv-catalog.js
          node --check work-identities.js
          node scripts/validate-work-catalog.mjs
          node --test tests/work-identities.test.mjs
