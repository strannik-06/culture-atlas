name: Propose TMDB metadata snapshot
on:
  workflow_dispatch:
jobs:
  propose:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pull-requests: write
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Validate catalogue
        run: |
          node --check scripts/refresh-tmdb.mjs
          node scripts/validate-catalog.mjs
      - name: Generate snapshot only after complete TMDB validation
        env:
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/refresh-tmdb.mjs --apply
      - name: Verify generated metadata
        run: |
          node --check film-details.js
          node --input-type=module -e "import fs from 'node:fs';const s=fs.readFileSync('film-details.js','utf8');const d=JSON.parse(s.split('window.CULTURE_FILM_DETAILS = ')[1].trim().replace(/;$/,''));if(Object.keys(d).length!==225)throw Error('Expected 225 films, got '+Object.keys(d).length);console.log('Verified '+Object.keys(d).length+' films')"
      - name: Create reviewable metadata PR
        uses: peter-evans/create-pull-request@v7
        with:
          token: ${{ secrets.GITHUB_TOKEN }}
          add-paths: film-details.js
          branch: generated/tmdb-film-details
          delete-branch: true
          commit-message: "Update validated TMDB metadata for 225 films"
          title: "Integrate validated TMDB metadata for 225 films"
          body: |
            Generated by the TMDB metadata workflow after a clean 225-film identity validation.
            Includes posters, descriptions, cast, director, runtime, genres and release dates.
            Review before merging; this workflow does not auto-merge.
