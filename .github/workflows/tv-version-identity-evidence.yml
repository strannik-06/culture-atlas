name: Read-only TV and version identity evidence
on:
  workflow_dispatch:
  push:
    branches: [audit/tv-version-identities]
    paths:
      - imports/tv-version-56-seeds.json
      - scripts/lookup-tv-version-identities.mjs
      - .github/workflows/tv-version-identity-evidence.yml
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Collect candidate metadata without progress access
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/lookup-tv-version-identities.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: tv-version-56-tmdb-evidence
          path: tv-version-56-tmdb-evidence.json
          if-no-files-found: warn
