name: Verify 13 historical film identities
on:
  workflow_dispatch:
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - name: Verify TMDB identities (read-only)
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: python3 scripts/verify-historical-13-tmdb.py historical-13-tmdb-verification.csv
      - uses: actions/upload-artifact@v4
        with:
          name: historical-13-tmdb-verification
          path: historical-13-tmdb-verification.csv
