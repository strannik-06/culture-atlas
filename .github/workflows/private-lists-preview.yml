name: Review private lists in Chromium
on:
  push:
    branches: [feat/private-lists, feat/list-pages, perf/catalogue-rendering, perf/lazy-book-history]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: npx playwright install --with-deps chromium
      - run: node scripts/preview-private-lists.mjs
      - run: node scripts/benchmark-book-startup.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: private-list-previews
          path: docs/previews/private-lists-*.png
