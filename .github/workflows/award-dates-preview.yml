name: Review award dates in Chromium
on:
  push:
    branches: [feat/award-event-dates]
permissions:
  contents: read
jobs:
  preview:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - run: npm ci --ignore-scripts
      - run: npm install --no-save --package-lock=false --ignore-scripts playwright@1.62.1
      - run: node scripts/preview-award-dates.mjs
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: award-date-previews
          path: docs/previews/award-dates-*.png
