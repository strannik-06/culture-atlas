name: Search unmatched historical ratings
on:
  workflow_dispatch:
permissions:
  contents: read
  actions: read
jobs:
  search:
    runs-on: ubuntu-latest
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Download latest triage
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          run_id="$(gh run list --workflow remaining-ratings-triage.yml --status success --limit 1 --json databaseId --jq '.[0].databaseId')"
          test -n "$run_id"
          mkdir -p /tmp/triage
          gh run download "$run_id" --name remaining-historical-ratings-triage --dir /tmp/triage
      - name: Search TMDB in Russian and English, movies and TV
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
        run: node scripts/search-unmatched-historical.mjs /tmp/triage/remaining-search_needed.csv
      - uses: actions/upload-artifact@v4
        with:
          name: unmatched-historical-search-review
          path: |
            unmatched-search-candidates.json
            unmatched-search-review.csv
          retention-days: 30
