name: Prepare verified 2011–2015 film awards
on:
  push:
    branches: [feat/film-awards-2011-2015]
    paths: [scripts/prepare-film-awards-history.mjs, "imports/*-2011-2015-source.json", imports/film-awards-2011-2015-overrides.json, imports/film-metadata-overrides.json, .github/workflows/film-awards-2011-2015-prepare.yml]
  workflow_dispatch:
permissions:
  contents: write
concurrency:
  group: prepare-film-awards-2011-2015
  cancel-in-progress: false
jobs:
  prepare:
    runs-on: ubuntu-latest
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Match new films by title and director and fetch metadata
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/prepare-film-awards-history.mjs 2011-2015
      - run: node scripts/seed-media-catalogue.mjs
      - run: node scripts/prepare-film-awards-catalogue-sync.mjs 2011-2015
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: film-awards-identity-audit
          path: imports/film-awards-2011-2015-audit.json
      - name: Commit data to the review branch
        if: always() && github.ref_name == 'feat/film-awards-2011-2015'
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          node scripts/build-film-detail-assets.mjs
          git add film-cards.js assets/film-details
          git add imports/film-metadata-completion.json film-catalog.js film-details.js awards-2025.js imports/film-awards-2011-2015-audit.json supabase/migrations/20261021_media_catalogue_seed.sql
          if test -f imports/film-awards-2011-2015-catalogue-sync.sql; then git add imports/film-awards-2011-2015-catalogue-sync.sql; fi
          if ! git diff --cached --quiet; then
            git commit -m "Verify 2011–2015 film award identities and prepare catalogue"
            git push origin HEAD:"$GITHUB_REF_NAME"
          fi
