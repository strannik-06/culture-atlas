name: Remaining version identity evidence
on:
  push:
    branches: [audit/remaining-tv-versions]
    paths:
      - imports/remaining-version-seeds.json
      - scripts/lookup-tv-version-identities.mjs
      - .github/workflows/remaining-version-evidence.yml
permissions:
  contents: read
jobs:
  lookup:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Read-only sequel metadata lookup
        env:
          TMDB_API_KEY: ${{ secrets.TMDB_API_KEY }}
          TMDB_READ_ACCESS_TOKEN: ${{ secrets.TMDB_READ_ACCESS_TOKEN }}
        run: node scripts/lookup-tv-version-identities.mjs imports/remaining-version-seeds.json remaining-version-evidence.json
      - uses: actions/upload-artifact@v4
        with:
          name: remaining-version-evidence
          path: remaining-version-evidence.json
